name: Scrape RAM prices

on:
  schedule:
    - cron: "0 13 * * *" # daily at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m db.init_db

      # Each scraper is independently resilient to blocked/failed requests
      # (see scrapers.common.scrape_search_pages), but continue-on-error is
      # kept here too as defense-in-depth: if one retailer's scraper still
      # crashes outright on some unexpected bug, the other's newly-scraped
      # data must not be lost, so later steps always run (if: always()).
      - run: python -m scrapers.newegg
        continue-on-error: true

      - run: python -m scrapers.amazon
        continue-on-error: true

      - run: python -m scrapers.pcpartpicker
        continue-on-error: true

      - run: python -m scripts.export_latest
        if: always()

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ram_data.db reports/
          git diff --cached --quiet || git commit -m "Daily RAM price scrape"
          git push
